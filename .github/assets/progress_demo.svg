<svg width="600" height="100" viewBox="0 0 600 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#1a1a1a" rx="10" ry="10" />
  <text x="20" y="30" font-family="monospace" font-size="14" fill="#00ff00">$ ./speedup_mac_heavy.sh</text>
  <text x="20" y="55" font-family="monospace" font-size="14" fill="#ffffff">Cleaning system caches... [</text>
  
  <rect x="200" y="42" width="300" height="15" fill="#333" rx="3" ry="3" />
  <rect x="200" y="42" width="0" height="15" fill="#00ff00" rx="3" ry="3">
    <animate attributeName="width" from="0" to="300" dur="4s" repeatCount="indefinite" />
  </rect>
  
  <text x="510" y="55" font-family="monospace" font-size="14" fill="#00ff00">
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite" />
    DONE
  </text>
  
  <text x="20" y="80" font-family="monospace" font-size="14" fill="#00ff00">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.7;1" dur="4s" repeatCount="indefinite" />
    Optimizing UI animations... SUCCESS
  </text>
</svg>
